name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: astron-x86_64-linux
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: astron-aarch64-macos
            ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: astron-x86_64-macos
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astron-x86_64-windows
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          bin=target/${{ matrix.target }}/release/astron
          tar czf ${{ matrix.artifact }}.tar.gz -C $(dirname $bin) astron

      - name: package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/astron.exe" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
