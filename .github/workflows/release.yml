name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: astron-x86_64-linux
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: astron-aarch64-macos
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astron-x86_64-windows
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          bin_dir=target/${{ matrix.target }}/release
          stage_dir=${{ matrix.artifact }}
          mkdir -p "$stage_dir"
          cp "$bin_dir/astron" "$stage_dir/"
          cp README.md "$stage_dir/"
          if [ -f LICENSE ]; then cp LICENSE "$stage_dir/"; fi
          tar czf ${{ matrix.artifact }}.tar.gz "$stage_dir"

      - name: package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.artifact }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/astron.exe" "${{ matrix.artifact }}/astron.exe"
          Copy-Item "README.md" "${{ matrix.artifact }}/README.md"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "${{ matrix.artifact }}/LICENSE" }
          Compress-Archive `
            -Path "${{ matrix.artifact }}/*" `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: checksums
        shell: bash
        run: sha256sum ${{ matrix.artifact }}.${{ matrix.ext }} > ${{ matrix.artifact }}.${{ matrix.ext }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.ext }}
            ${{ matrix.artifact }}.${{ matrix.ext }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
            *.zip
